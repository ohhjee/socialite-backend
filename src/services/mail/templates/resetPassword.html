<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f6f8; padding: 20px"
    >
      <tr>
        <td align="center">
          <!-- Container -->
          <table
            width="500"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; border-radius: 8px; overflow: hidden"
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: #4f46e5;
                  padding: 20px;
                  text-align: center;
                  color: #ffffff;
                "
              >
                <h1 style="margin: 0; font-size: 22px">Reset Your Password</h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 30px; color: #333333">
                <p style="font-size: 16px; margin: 0 0 15px">Hello,</p>

                <p style="font-size: 16px; margin: 0 0 20px">
                  We received a request to reset your password. Use the code
                  below to proceed:
                </p>

                <!-- Code Box -->
                <div style="text-align: center; margin: 30px 0">
                  <span
                    style="
                      display: inline-block;
                      padding: 15px 25px;
                      font-size: 28px;
                      letter-spacing: 5px;
                      background: #f3f4f6;
                      border-radius: 6px;
                      font-weight: bold;
                      color: #111827;
                    "
                  >
                    {{CODE}}
                  </span>
                </div>

                <p style="font-size: 14px; margin: 0 0 10px; color: #555">
                  This code will expire in <strong>15 minutes</strong>.
                </p>

                <p style="font-size: 14px; margin: 0 0 20px; color: #555">
                  If you didn’t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background: #f9fafb;
                  padding: 20px;
                  text-align: center;
                  font-size: 12px;
                  color: #888;
                "
              >
                © 2026 {{app_name}}. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
