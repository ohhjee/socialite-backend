<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Verify Your Account</title>
  </head>

  <body style="margin: 0; padding: 0; background: #f4f6f8; font-family: Arial">
    <table
      width="100%"
      style="padding: 20px; background: #f4f6f8"
    >
      <tr>
        <td align="center">
          <table
            width="520"
            style="background: #fff; border-radius: 8px; overflow: hidden"
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: #4f46e5;
                  color: #fff;
                  text-align: center;
                  padding: 20px;
                "
              >
                <h2 style="margin: 0">Verify Your Email</h2>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 30px">
                <p>Hello {{username}},</p>

                <p>
                  You need to verify your email to activate your account on
                  {{app_name}}.
                </p>

                <!-- Button -->
                <div style="text-align: center; margin: 30px 0">
                  <a
                    href="{{url}}"
                    style="
                      background: #4f46e5;
                      color: #fff;
                      padding: 14px 22px;
                      text-decoration: none;
                      border-radius: 6px;
                      display: inline-block;
                      font-weight: bold;
                    "
                  >
                    Verify Now
                  </a>
                </div>

                <p style="font-size: 13px; color: #666">
                  This link will expire in 15 minutes. If you didn’t request
                  this, ignore this email.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  text-align: center;
                  padding: 15px;
                  background: #f9fafb;
                  font-size: 12px;
                  color: #888;
                "
              >
                © {{app_name}} - All rights reserved
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
